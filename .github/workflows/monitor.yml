name: OnePiece Watch

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: onepiece-watch-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OnePiece Watch
        run: |
          python run_once.py

      - name: Save product state
        run: |
          git config user.name "OnePieceWatch Bot"
          git config user.email "actions@github.com"

          git add data/products.json

          if git diff --cached --quiet; then
            echo "No product state changes."
          else
            git commit -m "Update monitored product state"
            git push
          fi